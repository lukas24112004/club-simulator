<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Club Simulator</title>
    <style>
      :root { --cyan:#00e5ff; --magenta:#ff2bd6; --green:#39ff14; --text:#c9ceff; --muted:#6b7099; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #05050b; overflow: hidden; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; color: var(--text); user-select: none; }
      #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

      #hud { position: fixed; inset: 0; pointer-events: none; }
      #money { position: absolute; left: 24px; top: 14px; font-size: 44px; font-weight: 800; color: var(--green); text-shadow: 0 0 16px var(--green); }
      #stats { position: absolute; left: 26px; top: 70px; font-size: 14px; }
      #mode { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 13px; color: var(--muted); }
      #crosshair { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: rgba(255,255,255,.55); }
      #reset { position: absolute; left: 24px; bottom: 12px; pointer-events: auto; background: none; border: 0; color: var(--muted); font-size: 12px; cursor: pointer; }
      #reset:hover { color: #ff3b3b; }

      #shop { position: absolute; right: 20px; top: 16px; width: 300px; display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
      #shop h4 { margin: 0; font-size: 13px; letter-spacing: 3px; color: var(--cyan); }
      .card { position: relative; text-align: left; padding: 10px 12px 10px 38px; background: rgba(11,11,24,.82); border: 2px solid #3a3a55; border-radius: 6px; color: var(--text); cursor: pointer; font: inherit; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
      .card .title { font-size: 15px; }
      .card .cost { font-weight: 700; color: var(--muted); }
      .card small { grid-column: 1 / 3; color: var(--muted); }
      .card .key { position: absolute; left: 10px; top: 10px; width: 20px; height: 20px; line-height: 20px; text-align: center; border: 1px solid #3a3a55; border-radius: 4px; font-size: 12px; }
      .card.afford { border-color: var(--green); background: rgba(15,42,20,.85); box-shadow: 0 0 14px rgba(57,255,20,.25); }
      .card.afford .cost { color: var(--green); }
      .card.maxed { border-color: var(--cyan); }
      .card.maxed .cost { color: var(--cyan); }

      .popup { position: fixed; left: 0; top: 0; pointer-events: none; font-weight: 800; font-size: 18px; will-change: transform; }

      #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(ellipse at center, rgba(5,5,11,.55), rgba(5,5,11,.9)); cursor: pointer; text-align: center; }
      #overlay.hidden { display: none; }
      #overlay h1 { margin: 0; font-size: clamp(34px, 7vw, 72px); letter-spacing: 8px; color: #fff; text-shadow: 0 0 12px var(--cyan), 0 0 40px var(--cyan), 0 0 80px var(--magenta); }
      #overlay .go { font-size: 22px; color: var(--green); text-shadow: 0 0 12px var(--green); animation: blink 1.4s infinite; }
      #overlay .help { font-size: 14px; line-height: 1.8; color: var(--text); }
      #overlay kbd { border: 1px solid #3a3a55; border-radius: 4px; padding: 1px 7px; background: rgba(11,11,24,.8); }
      @keyframes blink { 50% { opacity: .45; } }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud">
      <div id="money">$0</div>
      <div id="stats"></div>
      <div id="crosshair"></div>
      <div id="shop"><h4>UPGRADES</h4></div>
      <div id="mode"></div>
      <button id="reset">Reset progress</button>
    </div>
    <div id="overlay">
      <h1>CLUB SIMULATOR</h1>
      <div class="go">Click to enter the club</div>
      <div class="help">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk &nbsp;·&nbsp; <kbd>Shift</kbd> run &nbsp;·&nbsp; mouse to look<br />
        <kbd>M</kbd> manager view &nbsp;·&nbsp; <kbd>1</kbd> <kbd>2</kbd> buy upgrades &nbsp;·&nbsp; <kbd>N</kbd> mute &nbsp;·&nbsp; <kbd>Esc</kbd> pause
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
